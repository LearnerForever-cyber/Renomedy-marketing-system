name: Validate content records

on:
  push:
    paths:
      - "content/**/*.json"
      - "scripts/**"
      - "tests/**"
      - "agents/**"
      - ".github/agents/**"
      - "docs/copilot-agent-validation.md"
      - "requirements.txt"
      - ".github/workflows/validate-content.yml"
  pull_request:
    paths:
      - "content/**/*.json"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate-content.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Validate all content records
        run: python scripts/validate_content.py content/
      - name: Run validator tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -v
