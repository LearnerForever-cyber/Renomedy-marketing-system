name: Validate content records

on:
  push:
    paths:
      - "content/**/*.json"
      - "scripts/validate_content.py"
      - ".github/workflows/validate-content.yml"
  pull_request:
    paths:
      - "content/**/*.json"
      - "scripts/validate_content.py"
      - ".github/workflows/validate-content.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sample content
        run: python scripts/validate_content.py content/sample-post.json
